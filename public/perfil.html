<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi perfil · STUAN BEWO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eef5;
    --panel: #ffffff;
    --ink: #13233f;
    --muted: #5b6b85;
    --accent: #2657d6;
    --line: #c9d3e3;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 24px;
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    line-height: 1.1;
    margin: 0 0 8px;
  }
  p { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 500; margin-bottom: 6px; }
  input {
    width: 100%;
    font: 600 1.4rem 'Bricolage Grotesque', sans-serif;
    letter-spacing: 0.1em;
    text-align: center;
    padding: 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    font: 500 1rem 'IBM Plex Sans', sans-serif;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  #msg { min-height: 1.4em; margin: 12px 0 0; color: var(--error); font-size: 0.95rem; }
  .profile h2 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 1.6rem;
    margin: 0 0 4px;
  }
  dl { margin: 20px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 500; text-align: right; }
  .link {
    background: none; color: var(--accent); width: auto; padding: 0;
    margin-top: 22px; text-decoration: underline; font-size: 0.95rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>Entra a tu perfil</h1>
    <p>Pega el código de 8 caracteres que te dio el bot de Telegram.</p>
    <label for="code">Código de acceso</label>
    <input id="code" maxlength="8" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">
    <button id="enter">Entrar</button>
    <p id="msg" role="alert"></p>
  </section>

  <section id="profile" class="profile" hidden>
    <h1>Tu perfil</h1>
    <h2 id="p-user"></h2>
    <dl>
      <dt>Registrado el</dt><dd id="p-date"></dd>
    </dl>
    <button id="logout" class="link">Salir</button>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const KEY = 'stuanbewo_code';

  function showProfile(p) {
    $('p-user').textContent = '@' + String(p.handle).replace(/^@/, '');
    $('p-date').textContent = p.registeredAt
      ? new Date(p.registeredAt).toLocaleDateString('es')
      : '—';
    $('login').hidden = true;
    $('profile').hidden = false;
  }

  async function login(code) {
    $('msg').textContent = '';
    $('enter').disabled = true;
    try {
      const r = await fetch('/api/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'No se pudo entrar.');
      sessionStorage.setItem(KEY, code);
      showProfile(data.profile);
    } catch (e) {
      sessionStorage.removeItem(KEY);
      $('msg').textContent = e.message;
    } finally {
      $('enter').disabled = false;
    }
  }

  $('enter').addEventListener('click', () => login($('code').value.trim()));
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enter').click(); });
  $('logout').addEventListener('click', () => {
    sessionStorage.removeItem(KEY);
    $('profile').hidden = true;
    $('login').hidden = false;
    $('code').value = '';
  });

  // Enlace directo desde el bot: /perfil.html?code=AB12CD34
  const fromUrl = new URLSearchParams(location.search).get('code');
  const saved = fromUrl || sessionStorage.getItem(KEY);
  if (saved) {
    if (fromUrl) history.replaceState(null, '', location.pathname); // quita el código de la URL
    login(saved);
  }
</script>
</body>
</html>
